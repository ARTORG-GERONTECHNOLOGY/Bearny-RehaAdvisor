# Gateway nginx — the only service bound to public ports 80/443.
# Terminates TLS and routes by hostname to the correct internal nginx.
# This file is independent of both dev and prod stacks.

# ── Rate limiting zones ───────────────────────────────────────────────────────
# Defined here (http context) so they apply to all server blocks below.
#
# login_limit   — 5 attempts per minute per IP; burst of 5 allowed immediately.
#                 Prevents brute-force password attacks. A legitimate user who
#                 mistyped their password 5 times will be held for ~1 min.
# register_limit — 3 registrations per minute per IP; prevents spam signups.
# export_limit  — 5 bulk exports per minute per IP; slows data scraping with a
#                 stolen admin token.
limit_req_zone $binary_remote_addr zone=login_limit:10m    rate=5r/m;
limit_req_zone $binary_remote_addr zone=register_limit:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=export_limit:10m   rate=5r/m;

# ── HTTP → HTTPS redirects ────────────────────────────────────────────────────
server {
    listen 80;
    server_name reha-advisor.ch www.reha-advisor.ch;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name dev.reha-advisor.ch;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Production → nginx-prod ─────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name reha-advisor.ch www.reha-advisor.ch;
    client_max_body_size 1g;

    ssl_certificate /etc/letsencrypt/live/reha-advisor.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reha-advisor.ch/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Auth endpoints: brute-force rate limiting ─────────────────────────
    # Login is limited to 5 requests/min per IP. A user who fat-fingers their
    # password multiple times will be delayed by at most ~1 minute before
    # their next attempt is accepted.
    location /api/auth/login/ {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://nginx-prod:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Registration is limited to 3 requests/min per IP to prevent spam
    # account creation.
    location /api/auth/register/ {
        limit_req zone=register_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://nginx-prod:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Admin bulk exports: rate limiting ─────────────────────────────────
    # Patient and audit exports are rarely used by real admins, so a tight
    # limit costs nothing. export/clinics/ is excluded — the dashboard loads it
    # on every mount.
    location ~ ^/api/admin/export/(patients|audit)/ {
        limit_req zone=export_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://nginx-prod:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # ── Everything else ───────────────────────────────────────────────────
    location / {
        proxy_pass http://nginx-prod:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}

# ── Dev → nginx-dev ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name dev.reha-advisor.ch;
    client_max_body_size 1g;

    ssl_certificate /etc/letsencrypt/live/dev.reha-advisor.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.reha-advisor.ch/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
